name: IDA Analysis (Show Logs)

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: "Name of the file"
        required: true
        type: string
      file_link:
        description: "GDrive link of the file"
        required: true
        type: string
      installer_link:
        description: "GDrive link of the installer"
        required: false
        type: string
        default: 1zXAhAcXvWe6TRagdjMKwI4_HF_bgH-Lo

jobs:
  ida_analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt -y install python3 python3-pip pipx zip
        pipx install gdown
        pipx ensurepath
        source ~/.profile

    - name: Download IDA Pro Installer
      run: |
        gdown -O idapro_90_x64linux.run ${{ github.event.inputs.installer_link }}

    - name: Install IDA Pro
      run: |
        chmod +x idapro_90_x64linux.run
        ./idapro_90_x64linux.run --mode unattended

    - name: Patch IDA Pro
      run: |
        cp $HOME/idapro-9.0/libida.so .
        cp $HOME/idapro-9.0/libida64.so .
        python3 ida90_beta.py
        mv libida.so.patched $HOME/idapro-9.0/libida.so
        mv libida64.so.patched $HOME/idapro-9.0/libida64.so
        mv ida.hexlic $HOME/.idapro/
        rm libida.so libida64.so

    - name: Setup IDA Pro
      run: |
        pip install $HOME/idapro-9.0/idalib/python
        python3 $HOME/idapro-9.0/idalib/python/py-activate-idalib.py
        python3 ida90_eula.py

    - name: Download File for Analysis
      run: |
        gdown --fuzzy -O ${{ github.event.inputs.target_file }} ${{ github.event.inputs.file_link }}

    # 🔵 STEP 1: IDA ANALYSIS WITH LOG
    - name: Run IDA Analysis (log enabled)
      run: |
        $HOME/idapro-9.0/idat64 \
          -P+ \
          -A \
          -Lida_analysis.log \
          -S"analyse.idc" \
          ${{ github.event.inputs.target_file }}

    # 🟢 STEP 2: RUN DUMP SCRIPT WITH LOG
    - name: Run dump_funcs.py (log enabled)
      run: |
        $HOME/idapro-9.0/idat64 \
          -P+ \
          -A \
          -Lida_dump.log \
          -S"dump_funcs.py" \
          ${{ github.event.inputs.target_file }}.i64

    # 🟡 STEP 3: PRINT LOGS TO GITHUB UI
    - name: Show IDA analysis log
      run: |
        echo "========== IDA ANALYSIS LOG =========="
        ls -l ida_analysis.log || true
        sed -n '1,200p' ida_analysis.log || true

    - name: Show IDA dump log
      run: |
        echo "========== IDA DUMP LOG =========="
        ls -l ida_dump.log || true
        sed -n '1,200p' ida_dump.log || true

    # 🟢 STEP 4: ZIP OUTPUTS + LOGS
    - name: Zip outputs
      run: |
        zip analysis_output.zip \
          ${{ github.event.inputs.target_file }}.i64 \
          ida_analysis.log \
          ida_dump.log \
          data_dump.bin || true

    # 🟢 STEP 5: UPLOAD ZIP
    - name: Upload analysis bundle
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.target_file }}-analysis
        path: analysis_output.zip
        compression-level: 9
