name: IDA Analysis with Data Dump

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: "Name of the file"
        required: true
        type: string
      file_link:
        description: "GDrive link of the file"
        required: true
        type: string
      installer_link:
        description: "GDrive link of the installer"
        required: true
        type: string

jobs:
  ida_analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip pipx
        pipx install gdown
        pipx ensurepath
        source ~/.profile

    - name: Download IDA Installer
      run: |
        gdown -O idapro.run ${{ github.event.inputs.installer_link }}

    - name: Install IDA Pro
      run: |
        chmod +x idapro.run
        ./idapro.run --mode unattended

    - name: Patch IDA Pro (License)
      run: |
        cp $HOME/idapro-9.0/libida.so .
        cp $HOME/idapro-9.0/libida64.so .
        python3 ida90_beta.py
        mv libida.so.patched $HOME/idapro-9.0/libida.so
        mv libida64.so.patched $HOME/idapro-9.0/libida64.so
        mv ida.hexlic $HOME/.idapro/

    - name: Setup IDA Python
      run: |
        pip install $HOME/idapro-9.0/idalib/python
        python3 $HOME/idapro-9.0/idalib/python/py-activate-idalib.py
        python3 ida90_eula.py

    - name: Download Target File
      run: |
        gdown --fuzzy -O ${{ github.event.inputs.target_file }} ${{ github.event.inputs.file_link }}

    - name: Run IDA Headless + Dump .data
      run: |
        $HOME/idapro-9.0/idat64 \
          -P+ \
          -A \
          -S"dump_data.py" \
          ${{ github.event.inputs.target_file }}

    - name: Upload IDA Database
      uses: actions/upload-artifact@v4
      with:
        name: ida-database
        path: ${{ github.event.inputs.target_file }}.i64
        compression-level: 9

    - name: Upload .data Dump
      uses: actions/upload-artifact@v4
      with:
        name: data-dump
        path: libtersafe_data.bin
        compression-level: 9
